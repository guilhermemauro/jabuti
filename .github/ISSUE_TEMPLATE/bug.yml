name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Security issue? Do not file it here: see SECURITY.md. Traces and logs hold your
        conversations and may hold data from your sites: redact them before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an agent with …
        2. Send …
        3. See …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace lines (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - docker compose (deploy)
        - compose.dev.yml
        - pnpm dev
    validations:
      required: true

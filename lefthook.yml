# Every check runs on every commit. A red hook means the commit is not ready;
# fix the cause instead of skipping with --no-verify.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,md,yml,yaml,css,html}"
      run: pnpm prettier --check {staged_files}
    - name: lint
      glob: "*.{ts,tsx,js}"
      run: pnpm eslint --max-warnings=0 {staged_files}
    - name: typecheck
      run: pnpm typecheck
    - name: knip
      run: pnpm knip
    - name: test
      run: pnpm test

commit-msg:
  jobs:
    - name: label
      run: node scripts/check-commit-msg.ts {1}
